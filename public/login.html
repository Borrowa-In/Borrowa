<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.google.com/recaptcha/ https://www.recaptcha.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://firebasestorage.googleapis.com; connect-src 'self' https://*.googleapis.com https://*.cloudfunctions.net https://*.run.app https://*.firebaseio.com wss://*.firebaseio.com https://api.ipify.org https://api64.ipify.org; frame-src https://*.firebaseapp.com https://www.google.com/recaptcha/ https://recaptcha.google.com; object-src 'none'; base-uri 'self'; form-action 'self'" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — Borrowa</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0a1a10" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" href="icons/favicon-32.png" />
<meta name="description" content="Log in or create your Borrowa account." />
<meta property="og:title" content="Log in — Borrowa" />
<meta property="og:description" content="Log in or create your Borrowa account." />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Borrowa" />
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="css/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="brand"><span class="brand-mark">B</span> Borrowa</a>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <h2 id="form-title">Welcome back</h2>
    <p class="sub" id="form-sub">Log in to borrow and lend items.</p>
    <div class="form-error" id="form-error"></div>

    <form id="login-form" method="POST" onsubmit="return false;">
      <div class="field" id="name-field" style="display:none;">
        <label>Username / Display Name</label>
        <input name="name" type="text" maxlength="60" placeholder="JordanLee" />
      </div>
      <div class="field" id="building-field" style="display:none;">
        <label>Building / floor</label>
        <input name="building" type="text" maxlength="60" placeholder="e.g. Block C, Floor 2" />
      </div>
      <div class="field">
        <label>Email</label>
        <input name="email" type="email" placeholder="you@example.com" required />
      </div>
      <div class="field">
        <label>Password</label>
        <input name="password" type="password" placeholder="••••••••" required minlength="6" />
      </div>
      <p id="mail-note" style="display:none;font-size:12.5px;line-height:1.45;background:#fef3c7;color:#78350f;border:1px solid #fcd34d;border-radius:8px;padding:9px 11px;margin:4px 0 12px;"></p>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Log in</button>
      <p class="auth-switch" id="forgot-wrap"><a href="#" id="forgot-link">Forgot password?</a></p>
    </form>

    <p class="auth-switch" id="switch-text">
      New to Borrowa? <a href="#" id="switch-link">Create an account</a>
    </p>
    <p class="auth-switch"><a href="home.html" id="guest-link">Continue as guest (view demo)</a></p>
  </div>
</div>

<script type="module">
  import { MAIL_NOTE } from "./js/firebase-config.js";
  import { signUp, logIn, resetPassword, needsVerification, enterGuestMode, syncAdminPrivileges } from "./js/auth.js";
  import { showDeviceFullDialog } from "./js/device-full.js";

  const params = new URLSearchParams(window.location.search);
  // Only allow redirects to pages on this site (blocks javascript: URLs and
  // open redirects to other domains via ?next=).
  const rawNext = params.get("next") || "";
  const nextPage = /^[A-Za-z0-9_-]+\.html(\?[A-Za-z0-9_=&%.-]*)?$/.test(rawNext) ? rawNext : "home.html";
  const guestLink = document.getElementById("guest-link");
  if (guestLink) {
    guestLink.addEventListener("click", enterGuestMode);
    guestLink.setAttribute("href", nextPage);
  }

  const errorBoxEl = document.getElementById("form-error");
  if (params.get("blocked") === "ip" && errorBoxEl) {
    errorBoxEl.textContent = "This device/network has been blocked by an admin. You've been signed out.";
    errorBoxEl.classList.add("show");
  }

  let mode = params.get("mode") === "signup" ? "signup" : "login";
  const form = document.getElementById("login-form");
  const errorBox = document.getElementById("form-error");
  const nameField = document.getElementById("name-field");
  const buildingField = document.getElementById("building-field");
  const title = document.getElementById("form-title");
  const sub = document.getElementById("form-sub");
  const submitBtn = document.getElementById("submit-btn");
  const switchText = document.getElementById("switch-text");

  function applyMode(isSignup) {
    if (nameField) nameField.style.display = isSignup ? "block" : "none";
    if (buildingField) buildingField.style.display = isSignup ? "block" : "none";
    if (title) title.textContent = isSignup ? "Create your account" : "Welcome back";
    if (sub) sub.textContent = isSignup ? "Join your community on Borrowa." : "Log in to borrow and lend items.";
    if (submitBtn) submitBtn.textContent = isSignup ? "Sign up" : "Log in";
    if (switchText) {
      switchText.innerHTML = isSignup
        ? `Already have an account? <a href="#" id="switch-link">Log in</a>`
        : `New to Borrowa? <a href="#" id="switch-link">Create an account</a>`;
      const switchLink = document.getElementById("switch-link");
      if (switchLink) switchLink.addEventListener("click", toggleMode);
    }
    if (errorBox) errorBox.classList.remove("show");
    const mn = document.getElementById("mail-note");
    if (mn) { mn.textContent = MAIL_NOTE; mn.style.display = isSignup ? "block" : "none"; }
    const fw = document.getElementById("forgot-wrap");
    if (fw) fw.style.display = isSignup ? "none" : "block";
  }

  function toggleMode(e) {
    e.preventDefault();
    mode = mode === "login" ? "signup" : "login";
    applyMode(mode === "signup");
  }

  applyMode(mode === "signup");

  document.getElementById("forgot-link").addEventListener("click", async (e) => {
    e.preventDefault();
    const email = form.elements.email.value.trim();
    errorBox.classList.remove("show");
    if (!email) { errorBox.textContent = "Type your email above first, then tap Forgot password."; errorBox.classList.add("show"); return; }
    try {
      await resetPassword(email);
      errorBox.textContent = "If an account exists for " + email + ", a reset link is on its way. " + MAIL_NOTE;
    } catch (err) {
      errorBox.textContent = err.code === "auth/too-many-requests" ? "Too many tries. Please wait a few minutes." : "That doesn't look like a valid email.";
    }
    errorBox.classList.add("show");
  });

  if (form) {
    // The whole attempt lives in one function so the "device is full" dialog can run it again
    // after the person has deleted one of the old accounts.
    async function attempt(data) {
      try {
        let user;
        if (mode === "signup") {
          user = await signUp({
            name: data.get("name"),
            email: data.get("email"),
            password: data.get("password"),
            building: data.get("building"),
          });
        } else {
          user = await logIn(data.get("email"), data.get("password"));
        }

        // Automatically sync admin role and route accordingly
        const isAdmin = await syncAdminPrivileges(user);

        if (isAdmin) {
          window.location.href = "admin.html";
        } else if (needsVerification(user, false)) {
          window.location.href = "verify.html?next=" + encodeURIComponent(nextPage);
        } else {
          window.location.href = nextPage;
        }

      } catch (err) {
        if (err.code === "device-taken" && err.accounts && err.accounts.length) {
          if (errorBox) { errorBox.textContent = err.message; errorBox.classList.add("show"); }
          showDeviceFullDialog(err.accounts, () => attempt(data));
          return;
        }
        if (errorBox) {
          errorBox.textContent = err.message.replace("Firebase: ", "");
          errorBox.classList.add("show");
        }
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (errorBox) errorBox.classList.remove("show");
      attempt(new FormData(form));
    });
  }
</script>
<script src="js/prefetch.js" defer></script>
</body>
</html>
