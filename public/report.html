</head><body>
<nav class="nav"><div class="nav-inner"><a href="index.html" class="brand"><span class="brand-mark">B</span> Borrowa</a></div></nav>
<main class="legal"><h1>Report a listing or member</h1>
<div class="form-error" id="msg"></div>
<form id="f" onsubmit="return false;"><div class="field"><label>What are you reporting?</label>
<select name="kind"><option value="item">A listing</option><option value="user">A member</option><option value="request">A borrow request</option></select></div>
<div class="field"><label>Listing or member ID (auto-filled from the link)</label><input name="target" maxlength="120" required /></div>
<div class="field"><label>Reason</label><select name="reason"><option>Scam / fake</option><option>Unsafe or illegal item</option><option>Harassment</option><option>Inappropriate photo</option><option>Other</option></select></div>
<div class="field"><label>Details (optional)</label><textarea name="details" maxlength="500" rows="4"></textarea></div>
<button class="btn btn-primary" id="go">Send report</button></form></main>
<footer class="site-footer"><div class="container"><span>© 2026 Borrowa</span><div class="footer-links"><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a><a href="contact.html">Contact</a></div></div></footer>
<script type="module">
import { auth, db } from "./js/firebase-config.js";
import { addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const q=new URLSearchParams(location.search), f=document.getElementById("f"), m=document.getElementById("msg");
if(q.get("type"))f.kind.value=["user","request"].includes(q.get("type"))?q.get("type"):"item"; if(q.get("id"))f.target.value=q.get("id");
let me=null; onAuthStateChanged(auth,u=>me=u);
f.addEventListener("submit",async()=>{ m.classList.add("show");
  if(!me){m.textContent="Please log in to send a report.";return;}
  try{await addDoc(collection(db,"reports"),{kind:f.kind.value,targetId:f.target.value.trim(),reason:f.reason.value,details:f.details.value.slice(0,500),reporterId:me.uid,status:"open",createdAt:serverTimestamp()});
    m.textContent="Thanks. An admin will review this.";f.reset();}
  catch(e){m.textContent="Couldn't send the report. Try again.";}});
</script><!-- Shourya(Shadow) -->
<div class="sw-mark" aria-hidden="true" data-author="Shourya(Shadow)">Shourya(Shadow)</div>
</body></html>
